<!doctype html>
<meta charset="utf-8">
<title>Windtunnel brand preview</title>
<style>
 body{margin:0;background:#e9e9ee;color:#0B0D10;font:14px/1.5 -apple-system,system-ui,sans-serif;padding:40px}
 .cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5e6070;margin:0 0 12px}
 .row{display:flex;align-items:stretch;gap:16px;margin-bottom:36px;flex-wrap:wrap}
 .sw{border-radius:14px;padding:26px;display:flex;align-items:center;gap:26px}
 .dk{background:#0B0D10}
 .lt{background:#FAFAFC}
 .app{border-radius:23%;display:block}
 .chip{width:120px;height:72px;border-radius:14px;display:flex;align-items:flex-end;padding:10px;font:12px ui-monospace,monospace;box-sizing:border-box}
</style>
<p class="cap">Mark, sizes 16 / 24 / 32 / 64</p>
<div class="row">
  <div class="sw lt"><img src="mark.svg" width="16" alt=""><img src="mark.svg" width="24" alt=""><img src="mark.svg" width="32" alt=""><img src="mark.svg" width="64" alt=""></div>
  <div class="sw dk"><img src="mark-dark.svg" width="16" alt=""><img src="mark-dark.svg" width="24" alt=""><img src="mark-dark.svg" width="32" alt=""><img src="mark-dark.svg" width="64" alt=""></div>
</div>
<p class="cap">Wordmark</p>
<div class="row">
  <div class="sw lt"><img src="wordmark.svg" height="44" alt="Windtunnel"></div>
  <div class="sw dk"><img src="wordmark-dark.svg" height="44" alt="Windtunnel"></div>
</div>
<p class="cap">App icon, sizes 16 / 32 / 64 / 120</p>
<div class="row">
  <div class="sw lt"><img class="app" src="icon.svg" width="16" alt=""><img class="app" src="icon.svg" width="32" alt=""><img class="app" src="icon.svg" width="64" alt=""><img class="app" src="icon.svg" width="120" alt=""></div>
  <div class="sw dk"><img class="app" src="icon.svg" width="16" alt=""><img class="app" src="icon.svg" width="32" alt=""><img class="app" src="icon.svg" width="64" alt=""><img class="app" src="icon.svg" width="120" alt=""></div>
</div>
<p class="cap">Colours</p>
<div class="row">
  <div class="chip" style="background:#7C5CFF;color:#fff">violet #7C5CFF</div>
  <div class="chip" style="background:#0B0D10;color:#FAFAFC">ink #0B0D10</div>
  <div class="chip" style="background:#FAFAFC;border:1px solid #e5e5ec">paper #FAFAFC</div>
</div>
